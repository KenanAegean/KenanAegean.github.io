<article class="portfolio active" data-page="portfolio">

    <header>
      <h2 class="h2 article-title">Portfolio 👾</h2>
    </header>

    <section class="projects">

      <!-- Desktop filter buttons - will be populated dynamically -->
      <ul class="filter-list"></ul>

      <div class="filter-select-box">

        <button class="filter-select" data-select>

          <div class="select-value" data-select-value>Select category</div>

          <div class="select-icon">
            <ion-icon name="chevron-down"></ion-icon>
          </div>

        </button>

        <!-- Mobile dropdown - will be populated dynamically -->
        <ul class="select-list"></ul>

      </div>

      <!-- Portfolio items will be dynamically loaded here -->
      <ul class="project-list"></ul>

    </section>

</article>
