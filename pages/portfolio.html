<article class="portfolio active" data-page="portfolio">

    <header>
      <h2 class="h2 article-title">Portfolio 👾</h2>
    </header>

    <section class="projects">

      <ul class="filter-list">

        <li class="filter-item">
          <button class="active" data-filter-btn>All</button>
        </li>

        <li class="filter-item">
          <button data-filter-btn>Highlighted Projects</button>
        </li>

        <li class="filter-item">
          <button data-filter-btn>Game Development</button>
        </li>

        <li class="filter-item">
          <button data-filter-btn>Windows Application</button>
        </li>

        <li class="filter-item">
          <button data-filter-btn>Web Application</button>
        </li>     

        <li class="filter-item">
          <button data-filter-btn>Other Projects</button>
        </li>

      </ul>

      <div class="filter-select-box">

        <button class="filter-select" data-select>

          <div class="select-value" data-select-value>Select category</div>

          <div class="select-icon">
            <ion-icon name="chevron-down"></ion-icon>
          </div>

        </button>

        <ul class="select-list">

          <li class="select-item">
            <button data-select-item>All</button>
          </li>

          <li class="select-item">
            <button data-select-item>Highlighted Projects</button>
          </li>

          <li class="select-item">
            <button data-select-item>Game Development</button>
          </li>

          <li class="select-item">
            <button data-select-item>Windows Application</button>
          </li>

          <li class="select-item">
            <button data-select-item>Web Application</button>
          </li>

          <li class="select-item">
            <button data-select-item>Other Projects</button>
          </li>

        </ul>

      </div>

      <!-- Portfolio items will be dynamically loaded here -->
      <ul class="project-list"></ul>

    </section>

</article>
