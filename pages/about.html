<article class="about active" data-page="about">

    <header>
        <h2 class="h2 article-title">About me 👾</h2>
    </header>

    <!-- About text section - populated by script -->
    <section class="about-text">
        <p id="about-greeting">
            <!-- Populated from site-config.json: personal.about.greeting -->
        </p>

        <p id="about-description">
            <!-- Populated from site-config.json: personal.about.description -->
        </p>
    </section>

    <!-- Add your custom hardcoded sections here -->
    <!-- Example:
    <section class="custom-section">
      <h3 class="h3">Your Custom Section</h3>
      <p>Your hardcoded content here...</p>
    </section>
    -->

    <!-- Highlighted Games section - populated by script -->
    <section class="clients">
        <h3 class="h3 clients-title">My Highlighted Game Projects 🎮</h3>
        <ul class="clients-list has-scrollbar" id="highlighted-games-list">
            <!-- Populated from games-showcase.json: highlighted[] -->
        </ul>
    </section>
    <br>

    <!-- GitHub Stats section - populated by script -->
    <section class="service">
        <h3 class="h3 service-title">My GitHub Stats 📊</h3>
        <ul class="project-list github-list">
            <li class="project-item active">
                <figure class="project-img" id="github">
                    <img id="github-stats-img" src="" alt="GitHub Stats" />
                    <!-- Populated from site-config.json: external.githubUsername -->
                </figure>
            </li>
        </ul>
    </section>

    <!-- GitHub Contribution Snake -->
    <section class="service">
        <h3 class="h3 service-title">My Contribution Journey 🐍</h3>
        <div style="width: 100%; overflow: hidden;">
            <img src="assets/images/snake/github-contribution-grid-snake.svg" alt="GitHub Contribution Snake Animation"
                style="width: 100%; height: auto; display: block;">
        </div>
    </section>
    <br>

    <!-- In Development section - populated by script -->
    <section class="clients">
        <h3 class="h3 clients-title">In Development 🎮</h3>
        <ul class="clients-list has-scrollbar" id="indev-games-list">
            <!-- Populated from games-showcase.json: inDevelopment[] -->
        </ul>
    </section>

</article>
