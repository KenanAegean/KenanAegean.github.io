<!-- CV Localization Script -->
<script>
  (function() {
    const link = document.getElementById('cv-download-link');
    if (!link) return;

    function userInTurkey() {
      const lang = (navigator.language || '').toLowerCase();
      const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').toLowerCase();
      return lang.startsWith('tr') || tz.includes('istanbul');
    }

    if (userInTurkey()) {
      link.href = '/assets/pdf/KenanEGE_CV_TR.pdf';
    } else {
      link.href = '/assets/pdf/KenanEGE_CV_PL.pdf';
    }
  })();
</script>
