<article class="More active" data-page="More">

    <header>
      <h2 class="h2 article-title">More About me 👾</h2>
    </header>

    <!-- Add your custom hardcoded sections here -->
    <!-- Example:
    <section class="service">
      <h3 class="h3 service-title">My Hobbies 🎨</h3>
      <p>Custom content about hobbies...</p>
    </section>
    -->

    <!-- Spotify Music Section - populated by script -->
    <section class="service">
      <h3 class="h3 service-title">Listen My Music 🎸</h3>
      <iframe id="spotify-embed" 
              style="border-radius:12px" 
              src="" 
              width="100%" 
              height="352" 
              frameBorder="0" 
              allowfullscreen="" 
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
              loading="lazy">
      </iframe>
      <!-- Populated from site-config.json: external.spotifyArtistId -->
    </section>

    <!-- Instagram Section - populated by script -->
    <section class="service">
      <h3 class="h3 service-title">Me On Social Media 📷</h3>

      <div class="insta-card">
        <div class="insta-card__header">
          <img id="insta-avatar"
            class="insta-card__avatar"
            src=""
            alt="Instagram profile picture"
          />
          <a id="insta-username"
            class="insta-card__username"
            href=""
            target="_blank"
            rel="noopener">
          </a>
          <!-- Populated from instagram.json: username, profileUrl, profileImage -->
        </div>

        <div class="insta-card__grid" id="insta-grid">
          <!-- Populated from instagram.json: posts[] -->
        </div>
      </div>
    </section>
    
    <!-- Steam Stats Section - populated by script -->
    <section class="service">
      <h3 class="h3 service-title">What I Play 👾</h3>

      <ul class="project-list github-list">
        <img class="project-img" id="steam" src="" alt="Steam Stats"/>
        <!-- Populated from site-config.json: external.steamUsername -->
      </ul>
    </section>

</article>
