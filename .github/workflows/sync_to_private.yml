name: Sync Public Repo to Private Repo

on:
  push:
    branches:
      - '*'  # Runs on all branches, but we filter later, public splitted_backup, private main_backup2

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Branch Name
        run: |
          echo "Extracting branch name..."
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "Extracted branch: ${GITHUB_REF#refs/heads/}"

      - name: Check Branch
        run: |
          echo "Current branch: $BRANCH_NAME"
          echo "Expected branch: ${{ secrets.PUBLIC_REPO_BRANCH }}"
          if [ "$BRANCH_NAME" != "${{ secrets.PUBLIC_REPO_BRANCH }}" ]; then
            echo "❌ Branch does not match! Exiting."
            exit 1
          else
            echo "✅ Branch matches! Proceeding..."
          fi

      - name: Checkout Public Repository
        uses: actions/checkout@v4
        with:
          path: public_repo
          fetch-depth: 0  # Ensures full history is checked out

      - name: Clone Private Repository
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          USERNAME: ${{ secrets.USERNAME }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
        run: |
          echo "Cloning private repository..."
          git clone https://${{ secrets.USERNAME }}:${{ secrets.PRIVATE_REPO_PAT }}@github.com/${{ secrets.USERNAME }}/${{ secrets.PRIVATE_REPO_NAME }}.git private_repo
          cd private_repo
          git checkout ${{ secrets.PRIVATE_REPO_BRANCH }}
          echo "✅ Checked out branch: ${{ secrets.PRIVATE_REPO_BRANCH }}"

      - name: Copy Updated Files from Public to Private Repo
        run: |
          echo "Syncing updated files..."
          rsync -av --delete --exclude '.git' --exclude '.github' public_repo/ private_repo/
          echo "✅ Files synced successfully!"

      - name: Configure Git User
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          cd private_repo
          git add .
          if git diff --staged --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "Sync from public repo"
            git push origin ${{ secrets.PRIVATE_REPO_BRANCH }}
            echo "✅ Changes pushed successfully!"
          fi

      - name: Delete private_repo Folder and Push Changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          cd private_repo
          echo "Deleting private_repo folder..."
          rm -rf private_repo  # Removes ONLY the private_repo folder
      
          if [ -d private_repo ]; then
            cd private_repo
            git add .
            if git diff --staged --quiet; then
              echo "✅ No changes to commit."
            else
              git commit -m "Cleanup: Removed private_repo folder"
              git push origin ${{ secrets.PRIVATE_REPO_BRANCH }}
              echo "✅ private_repo folder deleted and pushed!"
            fi
          else
            echo "✅ private_repo folder was already removed!"
          fi
        
        