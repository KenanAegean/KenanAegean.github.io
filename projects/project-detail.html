<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Project Details | Kenan EGE</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../assets/images/logo.ico" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css?v=2.2.3">
</head>

<body>
    <main>
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="main-content">
            <article class="about active" data-page="project-detail">
                <!-- Back Button -->
                <a id="back-link" href="../index.html" class="back-button animate-in">
                    <ion-icon name="arrow-back-outline"></ion-icon>
                    <span>Back to Portfolio</span>
                </a>


                <!-- Project Header -->
                <h1 id="project-main-title" class="project-main-title"></h1><br>

                <!-- Project Logo Section -->
                <section id="logo-section" class="project-logo-section animate-in-delay-2" style="display:none;">
                    <div class="project-logo-wrapper">
                        <img id="project-logo" src="" alt="" loading="lazy" />
                    </div>
                </section>

                <!-- Dynamic Content Sections -->
                <div id="project-content" class="animate-in-delay-3"></div>

                <!-- Project Links -->
                <div id="project-links" class="project-links" style="display:none;"></div>
            </article>

            <!-- Footer -->
            <div id="footer-container"></div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" aria-label="Close lightbox">
            <ion-icon name="close-outline"></ion-icon>
        </button>
        <button class="lightbox-nav lightbox-prev" aria-label="Previous image">
            <ion-icon name="chevron-back-outline"></ion-icon>
        </button>
        <button class="lightbox-nav lightbox-next" aria-label="Next image">
            <ion-icon name="chevron-forward-outline"></ion-icon>
        </button>
        <div class="lightbox-content">
            <img id="lightbox-image" src="" alt="">
            <div id="lightbox-caption" class="lightbox-caption"></div>
            <div id="lightbox-counter" class="lightbox-counter"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
